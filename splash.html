<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #000000;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }
    .splash-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .glow {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 100, 0, 0.45) 0%, rgba(255, 100, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(24px);
      animation: pulseGlow 2s infinite alternate ease-in-out;
      z-index: 1;
    }
    .logo-svg {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 0 30px rgba(255, 100, 0, 0.75));
      z-index: 2;
      animation: rotateLogo 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .title {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      z-index: 2;
    }
    .title span {
      color: #ff6400;
    }
    .loader {
      margin-top: 24px;
      width: 160px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }
    .loader-bar {
      position: absolute;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #ff6400, #ffaa00);
      border-radius: 4px;
      animation: slideLoader 1.3s infinite ease-in-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes rotateLogo {
      0% { transform: rotate(-35deg) scale(0.7); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.85); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0.95; }
    }
    @keyframes slideLoader {
      0% { left: -45%; }
      50% { left: 100%; }
      100% { left: -45%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="glow"></div>
    <svg class="logo-svg" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="#FF6400"/>
      <path d="M12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4ZM12 6.5C15.0376 6.5 17.5 8.96243 17.5 12C17.5 15.0376 15.0376 17.5 12 17.5C8.96243 17.5 6.5 15.0376 6.5 12C6.5 8.96243 8.96243 6.5 12 6.5Z" fill="#FF7C24"/>
      <circle cx="10" cy="12" r="5" fill="#FFFFFF"/>
      <circle cx="10" cy="12" r="2.8" fill="#FF6400"/>
    </svg>
    <div class="title">Crunchy<span>roll</span></div>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
  </div>
</body>
</html>
